"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = false
format = """
$nix_shell$username$hostname:$directory$git_branch$lua$character
"""
right_format = """$time$cmd_duration"""

[character]
success_symbol = "[λ](#b794f4) ≻"  # Light purple
error_symbol = "[λ](#f9a8d4) ≻"    # Bright magenta-purple

[username]
style_user = "#9f7aea"          # Medium purple, dimmed
style_root = "#d6bcfa"          # Light purple, dimmed
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[@$hostname](#b794f4 bold)"  # Light purple
disabled = false
ssh_symbol = "  "

# truncation length works backwards (i.e., cwd > parent > parent ...)
[directory]
truncation_length = 15
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾 "
style = "#c4b5fd bold"              # Very light purple

[git_branch]
truncation_length = 25
truncation_symbol = ''
format = "\\($branch\\) "
symbol = ""
style = "#a78bfa"                   # Medium-light purple

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '[++\($count\)](#c4b5fd)'  # Very light purple
style = "#b794f4"                   # Light purple

[git_commit]
commit_hash_length = 4

[env_var.SHELL]
variable = "SHELL"
default = "unknown shell"
disabled = true

[nix_shell]
symbol = "󱄅 "
format = '[$symbol$name]($style) '
style = "#9f7aea"                   # Medium purple

[cmd_duration]
min_time = 500
format = 'took [$duration](#a78bfa)!'   # Medium-light purple

[lua]
symbol = " "
detect_extensions = ["lua", "luau"]
lua_binary = "/home/alarm/bin/lunev"
format = 'via [$symbol($version )](#9f7aea)'  # Medium purple

